services:
  dashboard-backend:
    build: ./backend
    # Bound to loopback only: the dashboard itself talks to the backend through
    # the nginx proxy. Publishing 8000 to all interfaces would let other hosts
    # connect directly and rotate the client-settable X-Real-IP to reset the
    # rate limiters. Local dev can still reach http://127.0.0.1:8000 directly.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY:?API_KEY is required — set it in .env or the shell environment}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # No credentials in the URL: config.py embeds REDIS_PASSWORD (URL-encoded,
      # safe for special characters) via the _embed_redis_password validator.
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required — set a strong value}
      - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD:?SUPER_USER_PASSWORD is required — set a strong value}
      - TRUST_PROXY_HEADERS=true
    depends_on:
      - redis
    user: "1000:1000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 5173 (plaintext HTTP) is loopback-only — cleartext super-user
      # passwords and secrets must not cross the LAN. Use https://localhost:443.
      - "127.0.0.1:5173:5173"
      - "443:443"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - API_KEY=${API_KEY:-}
    depends_on:
      - dashboard-backend

  redis:
    # Version-pinned (matches k8s/deploy-redis.yaml) instead of the mutable
    # redis:alpine floating tag.
    image: redis:7.2-alpine
    # Not published on the host — only reachable from the backend container
    # via the compose network.
    ports: []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    user: "999:999"

volumes:
  redis-data:
