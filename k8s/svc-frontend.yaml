apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend
  labels:
    app: dashboard-frontend
spec:
  type: NodePort
  ports:
    # HTTPS only. The plaintext HTTP route (80 → 5173) was removed:
    # super-user passwords and secret values must never transit a
    # world-reachable NodePort in cleartext. Pod liveness/readiness probes
    # still target container port 5173 internally and are unaffected.
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: dashboard-frontend
