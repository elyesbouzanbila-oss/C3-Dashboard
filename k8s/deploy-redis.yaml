apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-redis
  labels:
    app: dashboard-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-redis
  template:
    metadata:
      labels:
        app: dashboard-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      # No nodeSelector — Redis is a stateless cache that can run on any node.
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: dashboard-redis-pvc
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              protocol: TCP
          command:
            - /bin/sh
            - -c
          args:
            - |
              # Persistence is disabled to avoid the Redis fork/AOF overhead that
              # can trigger OOM kills under the small memory budget in this lab.
              exec redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --save "" \
                --appendonly no \
                --maxmemory 96mb \
                --maxmemory-policy allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-redis-password
                  key: redis-password
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"