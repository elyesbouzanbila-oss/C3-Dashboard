apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  labels:
    app: dashboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      serviceAccountName: dashboard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # No nodeSelector — the backend can use in-cluster auth from any node
      # via its service account (dashboard-sa).
      containers:
        - name: backend
          image: dashboard-backend:latest
          # imagePullPolicy: Never — local/kind cluster only! In production,
          # remove this line or change to Always / IfNotPresent so the pod
          # pulls from a real container registry.
          # Use IfNotPresent so the image is either loaded locally (kind load)
          # or pulled from a registry. Change to Always if you push to a registry.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: K8S_MODE
              value: "incluster"
            # FRONTEND_URL is used by the CORS middleware. Since all browser
            # requests go through the same-origin nginx proxy on the frontend pod,
            # CORS is not enforced for normal operation. Set this to the external
            # URL if you need direct backend access from a different origin.
            - name: FRONTEND_URL
              value: "http://dashboard-frontend:5173"
            # API_KEY is no longer sent from the frontend. To protect the
            # diagnostics POST endpoint, set this via a Kubernetes Secret.
            # The backend checks X-API-Key header against this value.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-api-key
                  key: api-key
            - name: REDIS_URL
              value: "redis://dashboard-redis:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-redis-password
                  key: redis-password
            - name: PROMETHEUS_URL
              value: "http://monitor-kube-prometheus-st-prometheus.monitoring.svc.cluster.local:9090"
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: api-key
            - name: AI_BASE_URL
              value: "https://api.groq.com/openai/v1"
            - name: AI_MODEL
              value: "llama-3.3-70b-versatile"
            - name: AI_ENABLED
              value: "true"
            # ── SECURITY: set these two for a hardened cluster ──────────────
            # ── SECURITY: required for a hardened cluster ──────────────
            # Without SUPER_USER_PASSWORD every write is refused (fail closed).
            # Create the secret before deploying:
            #   kubectl create secret generic dashboard-super-user \\
            #     --from-literal=password=<strong-password> \\
            #     --from-literal=falco-webhook-secret=<strong-secret> -n k8s-dashboard
            - name: SUPER_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-super-user
                  key: password
            - name: FALCO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-super-user
                  key: falco-webhook-secret
            # nginx overwrites X-Real-IP with the socket peer address before
            # proxying to us, so the rate-limit key can be trusted. The backend
            # is ClusterIP-only — it has no direct route from clients.
            - name: TRUST_PROXY_HEADERS
              value: "true"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
