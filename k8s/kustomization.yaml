apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-dashboard

resources:
  - namespace.yaml
  - sa.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  # secret manifests (gitignored, created locally with real values) —
  # required before `kubectl apply -k` will build.
  - secret-groq.yaml
  - secret-redis.yaml
  - secret-super-user.yaml
  - deploy-backend.yaml
  - svc-backend.yaml
  - deploy-frontend.yaml
  - svc-frontend.yaml
  - deploy-redis.yaml
  - svc-redis.yaml
  - pvc-redis.yaml
  - networkpolicy-redis.yaml
  - networkpolicy-backend.yaml
  - networkpolicy-frontend.yaml
  # networkpolicy-falco.yaml is intentionally NOT listed here — it targets
  # the falco namespace and would be rewritten into k8s-dashboard by the
  # kustomization `namespace` field. Apply it separately:
  #   kubectl apply -f k8s/networkpolicy-falco.yaml
  # cert-issuer.yaml is NOT listed here intentionally:
  # deploy.sh applies it *conditionally* (only when cert-manager
  # is detected). Adding it globally would break standalone
  # 'kubectl apply -k k8s/' runs on clusters without cert-manager.
